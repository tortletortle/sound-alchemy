name: Prototype regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test continuous tunnel motion
        run: node tests/travel.test.cjs
      - name: Test adaptive acoustic front end
        run: node tests/acoustics.test.cjs
      - name: Test adaptive music decisions
        run: node tests/music.test.cjs
